name: Build and publish highlight darkening guard

on:
  push:
    branches:
      - release/highlight-darkening-guard

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/highlight-darkening-guard
          fetch-depth: 0
          submodules: 'false'

      - name: Enable Windows long paths and fetch submodules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --system core.longpaths true
          git submodule sync
          git submodule update --init --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build full Release configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild /m /p:Configuration=Release . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "x64\Release\a"
          if (-not (Test-Path $out)) { throw "Release output directory not found: $out" }
          $asset = Join-Path $env:GITHUB_WORKSPACE "OptiScaler-NR-highlight-darkening-guard.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $asset -CompressionLevel Optimal -Force
          if (-not (Test-Path $asset)) { throw "Release archive was not created" }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "highlight-darkening-guard"
          $target = "ae28448429cb380de4cbbab2bbbe19b8c1d93c28"
          $asset = Join-Path $env:GITHUB_WORKSPACE "OptiScaler-NR-highlight-darkening-guard.zip"
          gh release create $tag $asset --target $target --title "Highlight + Darkening Guard" --notes "Validated build with independent Highlight guard and Darkening guard. Highlight guard limits brightening only. Darkening guard independently limits maximum luminance reduction; 100% leaves darkening uncapped. FXC/DX12, Vulkan/SPIR-V and full MSBuild Release validation passed before the PR was updated. Source commit: ae28448429cb380de4cbbab2bbbe19b8c1d93c28. PR: https://github.com/wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass/pull/94"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
