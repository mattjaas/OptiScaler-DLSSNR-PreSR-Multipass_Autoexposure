name: Publish highlight darkening guard release

on:
  push:
    branches:
      - test/highlight-darkening-guard

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/highlight-darkening-guard

      - name: Download validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10905064990/zip > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          find artifact -type f -maxdepth 2

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=$(find artifact -type f -name "*.7z" | head -n 1)
          test -n "$ASSET"
          TAG="highlight-darkening-guard"
          TARGET="ae28448429cb380de4cbbab2bbbe19b8c1d93c28"
          gh release create "$TAG" "$ASSET" --target "$TARGET" --title "Highlight + Darkening Guard" --notes "Validated build with independent Highlight guard and Darkening guard. FXC/DX12, Vulkan/SPIR-V and full MSBuild Release all passed. Source commit: ae28448429cb380de4cbbab2bbbe19b8c1d93c28. PR: https://github.com/wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass/pull/94"
