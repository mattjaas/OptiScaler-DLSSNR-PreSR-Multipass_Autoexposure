name: Build NR v37 shared Low36 samples and Fast ABBA

on:
  push:
    branches:
      - codex/nr-interpass-v12-interior-addressing
      - codex/nr-interpass-v13-bounded-area
    paths:
      - OptiScaler/Config.h
      - OptiScaler/Config.cpp
      - OptiScaler.ini
      - OptiScaler/dlssnr/**
      - OptiScaler/shaders/dlssnr/**
      - tests/test_nr_interpass_*.py
      - tests/test_nr_benchmark_cases.py
      - tests/nr_gpu/**
      - tools/compile_nr_interpass.ps1
      - .github/workflows/build_nr_detail_quality_experiments.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nr-interpass-v37-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify retained arithmetic and benchmark
        shell: powershell
        run: |
          foreach ($test in @("shared_bilinear", "dynamic_geometry", "classic_downsample_clamp", "classic_guided_stencil", "tiled_fused_area", "fast_experiments", "cadence", "low_cache")) {
            python "tests/test_nr_interpass_${test}.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tests/test_nr_benchmark_cases.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile standard shader, retained RGB/Fast and isolated experimental PSOs
        shell: powershell
        run: ./tools/compile_nr_interpass.ps1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run production policy tests and compile GPU parity fixture
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "C++ toolchain missing" }
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          New-Item -ItemType Directory -Force -Path artifacts/nr-v20 | Out-Null
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_policy.cpp /Fe:artifacts/nr-v20/interpass_policy.exe /Fo:artifacts/nr-v20/interpass_policy.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/nr-v20/interpass_policy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_parity.cpp /Fe:artifacts/nr-v20/interpass_parity.exe /Fo:artifacts/nr-v20/interpass_parity.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_low_timing.cpp /Fe:artifacts/nr-v20/interpass_low_timing.exe /Fo:artifacts/nr-v20/interpass_low_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_fast_quality.cpp /Fe:artifacts/nr-v20/interpass_fast_quality.exe /Fo:artifacts/nr-v20/interpass_fast_quality.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_fast_timing.cpp /Fe:artifacts/nr-v20/interpass_fast_timing.exe /Fo:artifacts/nr-v20/interpass_fast_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_experiments_quality.cpp /Fe:artifacts/nr-v20/interpass_experiments_quality.exe /Fo:artifacts/nr-v20/interpass_experiments_quality.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_experiments_timing.cpp /Fe:artifacts/nr-v20/interpass_experiments_timing.exe /Fo:artifacts/nr-v20/interpass_experiments_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile shared Low36 GPU audit and timing fixture
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "C++ toolchain missing" }
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          foreach ($fixture in @("quality", "timing")) {
            cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_low_cache_${fixture}.cpp /Fe:artifacts/nr-v20/interpass_low_cache_${fixture}.exe /Fo:artifacts/nr-v20/interpass_low_cache_${fixture}.obj /link d3d12.lib dxgi.lib"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "nr-interpass-v37-low36-cache-20261012"

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-interpass-v37-low36-cache-20261012
          path: release/OptiScaler-NR-nr-interpass-v37-low36-cache-20261012.zip
          if-no-files-found: error

      - name: Publish experimental GitHub Release
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nr-interpass-v37-low36-cache-20261012"
          $archive = "release/OptiScaler-NR-nr-interpass-v37-low36-cache-20261012.zip"
          $notes = @"
          Shared Low36 samples from $env:GITHUB_SHA.
          New opt-in Model / Inter-pass reconstruction: Fast cached low (experimental), INI mode 8.
          Original Fast mode 4, reference modes and exact Optimized policy are retained.
          Low36 keeps all 36 positive weights, overlap, signed residual sanitization and normalization.
          An 8x8 low-output group shares a 34x34 sample tile: 13,872 bytes LDS and one group barrier.
          No additional dispatch, texture, copy or per-frame allocation. PSO is created lazily.
          Only inter-pass low shaping changes; equal high/low gains skip low work as before.
          Source-coordinate FP rounding differs. Perceptual equivalence needs in-game motion/HDR inspection.
          Local RTX4090 shader timestamps test low+Cross5, excluding NGX and final resolve.
          Results and stress bounds are recorded in docs/NR-v37-low36-cache.md; no whole-game gain claim.
          New comparison: P50/P59/P65, Off, both references, Optimized, then original Fast/cached/cached/Fast ABBA.
          18 configurations / 24 windows, independent warmup, whole-NR GPU timestamps and paired CSV.
          Preserves shaping/pass gains; optional visual holds; original settings restored on finish/cancel.
          Benchmarks retain the limit P65 and do not append higher current scales.
          All modes retain v36 cadence: below P74 every transition, P74-P84 stride 2, P85-P90 stride 3.
          Between P84 and P85 and above P90 inter-pass is disabled. Never correct after the last model.
          Original shaders including ordinary/final low filter and Vulkan bytecode are unchanged.
          Cached low PSO failure falls back to the original standard low filter and reports fallback.
          "@
          $notesPath = "artifacts/nr-v20/release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          $ErrorActionPreference = "Continue"
          gh release view $tag --json id 1>$null 2>$null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($exists) {
            gh release upload $tag $archive --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
            gh release edit $tag --target $env:GITHUB_SHA --title "OptiScaler NR v37 - Shared Low36 samples, Fast ABBA" --notes-file $notesPath --prerelease
          } else {
            gh release create $tag $archive --target $env:GITHUB_SHA --title "OptiScaler NR v37 - Shared Low36 samples, Fast ABBA" --notes-file $notesPath --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
