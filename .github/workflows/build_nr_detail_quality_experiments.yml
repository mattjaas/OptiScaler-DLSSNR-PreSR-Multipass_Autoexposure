name: Build NR inter-pass shared bilinear v2

on:
  push:
    branches:
      - codex/nr-interpass-shared-bilinear-v2
    paths:
      - OptiScaler/Config.h
      - OptiScaler/Config.cpp
      - OptiScaler.ini
      - OptiScaler/dlssnr/PassProfiles.h
      - OptiScaler/dlssnr/DlssNr_Menu.cpp
      - OptiScaler/dlssnr/DlssNr_MenuControls.cpp
      - OptiScaler/dlssnr/DlssNr_Status.h
      - OptiScaler/dlssnr/DlssNr_Status.cpp
      - OptiScaler/dlssnr/DlssNr_AnalysisCapture.h
      - OptiScaler/shaders/dlssnr/DlssNr_Common.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_DeferredSr.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Status.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_FinishedQueue.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_ModelState.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Resources.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_State.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Encode.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Run.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Enlarge.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Upscaler_Dx12.h
      - OptiScaler/shaders/dlssnr/DlssNr_Upscaler_Dx12.cpp
      - OptiScaler/shaders/dlssnr/precompile/dlssnr.hlsl
      - tests/test_nr_interpass_shared_bilinear.py
      - .github/workflows/build_nr_detail_quality_experiments.yml

permissions:
  contents: write

concurrency:
  group: nr-interpass-shared-bilinear-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify shared P50 bilateral / bilinear arithmetic
        shell: powershell
        run: python tests/test_nr_interpass_shared_bilinear.py

      - name: Rebuild NR detail experiment shader
        shell: powershell
        run: |
          Push-Location "OptiScaler/shaders/dlssnr/precompile"
          & "..\..\shader_tools\dxc.exe" -T cs_6_0 -E CSMain -O3 -Qstrip_debug -Qstrip_reflect "dlssnr.hlsl" -Fo "DlssNr_Shader.cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "..\..\shader_tools\create_header.py" "DlssNr_Shader.cso" "DlssNr_Shader.h" "DlssNr_cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "nr-interpass-shared-bilinear-v2-20261009"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-interpass-shared-bilinear-v2-20261009
          path: release/OptiScaler-NR-nr-interpass-shared-bilinear-v2-20261009.zip
          if-no-files-found: error

      - name: Publish compiled ZIP as experimental GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nr-interpass-shared-bilinear-v2-20261009"
          $archive = "release/OptiScaler-NR-nr-interpass-shared-bilinear-v2-20261009.zip"
          if (-not (Test-Path $archive)) { throw "Release ZIP missing: $archive" }
          $notes = @"
          Experimental build from commit $env:GITHUB_SHA of codex/nr-interpass-shared-bilinear-v2.

          Includes all low-band antialias and exact-optimized inter-pass v1 changes.
          New optional Share bilinear + guided P50 taps (v2): ON reuses the same
          3x3 source neighbourhood for the four positive-weight P100-guided and
          bilinear edits with P50 + Area + Guided radius 1. Reduces redundant
          bilinear texture fetches and statically unrolls this narrow stencil.
          OFF retains exact-optimized v1 as an in-build A/B baseline.
          The path is edge-clamped, preserves four independent P100 guides and
          maintains all frequency shaping. Floating-point rounding may differ.
          CPU arithmetic edge/corner test and DXC shader compilation run in CI.
          Actual image quality and GPU ms still require in-game validation.
          "@
          gh release create $tag $archive --target $env:GITHUB_SHA --title "OptiScaler NR - shared guided/bilinear P50 inter-pass v2 (experimental)" --notes $notes --prerelease
