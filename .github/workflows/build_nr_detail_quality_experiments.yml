name: Build NR v36 cadence P74-P84 / P85-P90 and benchmarks up to P65

on:
  push:
    branches:
      - codex/nr-interpass-v12-interior-addressing
      - codex/nr-interpass-v13-bounded-area
    paths:
      - OptiScaler/Config.h
      - OptiScaler/Config.cpp
      - OptiScaler.ini
      - OptiScaler/dlssnr/**
      - OptiScaler/shaders/dlssnr/**
      - tests/test_nr_interpass_*.py
      - tests/test_nr_benchmark_cases.py
      - tests/nr_gpu/**
      - tools/compile_nr_interpass.ps1
      - .github/workflows/build_nr_detail_quality_experiments.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nr-interpass-v36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify retained arithmetic and benchmark
        shell: powershell
        run: |
          foreach ($test in @("shared_bilinear", "dynamic_geometry", "classic_downsample_clamp", "classic_guided_stencil", "tiled_fused_area", "fast_experiments", "cadence")) {
            python "tests/test_nr_interpass_${test}.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tests/test_nr_benchmark_cases.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile standard shader, retained RGB/Fast and isolated experimental PSOs
        shell: powershell
        run: ./tools/compile_nr_interpass.ps1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run production policy tests and compile GPU parity fixture
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "C++ toolchain missing" }
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          New-Item -ItemType Directory -Force -Path artifacts/nr-v20 | Out-Null
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_policy.cpp /Fe:artifacts/nr-v20/interpass_policy.exe /Fo:artifacts/nr-v20/interpass_policy.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/nr-v20/interpass_policy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_parity.cpp /Fe:artifacts/nr-v20/interpass_parity.exe /Fo:artifacts/nr-v20/interpass_parity.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_low_timing.cpp /Fe:artifacts/nr-v20/interpass_low_timing.exe /Fo:artifacts/nr-v20/interpass_low_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_fast_quality.cpp /Fe:artifacts/nr-v20/interpass_fast_quality.exe /Fo:artifacts/nr-v20/interpass_fast_quality.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_fast_timing.cpp /Fe:artifacts/nr-v20/interpass_fast_timing.exe /Fo:artifacts/nr-v20/interpass_fast_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_experiments_quality.cpp /Fe:artifacts/nr-v20/interpass_experiments_quality.exe /Fo:artifacts/nr-v20/interpass_experiments_quality.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_experiments_timing.cpp /Fe:artifacts/nr-v20/interpass_experiments_timing.exe /Fo:artifacts/nr-v20/interpass_experiments_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "nr-interpass-v36-scale-cadence-20261012"

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-interpass-v36-scale-cadence-20261012
          path: release/OptiScaler-NR-nr-interpass-v36-scale-cadence-20261012.zip
          if-no-files-found: error

      - name: Publish experimental GitHub Release
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nr-interpass-v36-scale-cadence-20261012"
          $archive = "release/OptiScaler-NR-nr-interpass-v36-scale-cadence-20261012.zip"
          $notes = @"
          Scale-aware inter-pass cadence from $env:GITHUB_SHA.
          User observed worse inter-pass image quality near native resolution.
          All modes: below P74 after each pass; P74 through P84 after model passes 2,4,...; P85 through P90 after model passes 3,6,...; between P84 and P85 and above P90 disabled.
          Six passes: five, two, or one corrections in active ranges; zero when disabled. No correction after the final model pass.
          Thresholds use requested WorkingScale before rounding actual texture dimensions.
          Off, reference, Optimized and Fast modes share the same schedule; saved selection is retained.
          Skipped transitions use ordinary ClampProxy and are not reconstruction failures.
          Path/cadence changes reset model histories without recreating NGX features.
          The immutable cumulative residual base and original shader mathematics are retained.
          High/mid multiplies the actual gain of each model's style and configured Structure in its unconsumed block.
          After resolution correction: adjusted_high=1+(high-1)*clamp(configured Structure,0,1).
          Structure zero is neutral; values above one use the Structure=1 calibration, without extrapolation.
          No repetition of the last style's gain. At P74-P84 six passes cover model pairs 1-2,3-4,5-6; five end with model5. At P85-P90 six cover 1-3 then 4-6, five cover 1-3 then 4-5.
          The shared rule also fixes mixed-style gains in ordinary final resolve without inter-pass.
          Existing high/mid multiplication option retained; low remains a single gain of the block's last model.
          Configuration metadata records preset, style and configured Structure for all six benchmark models.
          Low keeps one gain per correction/resolve; disabling compounding keeps high/mid at one gain per correction/resolve.
          Without active inter-pass the ordinary Off final resolve covers all effective passes. No extra GPU shaping dispatch.
          Low36 and Cross5 remain integrated Fast at eligible active scales, including P50.
          No HLSL or bytecode changes; skipped transitions avoid low/correction dispatches and related barriers/resources.
          All benchmarks are limited to P65; the high-scale cadence profile was removed at user request.
          Compact Fast comparison: P50/P59/P65, five configurations and seven windows per scale.
          Off and both references retained, then Optimized/Fast/Fast/Optimized ABBA: 15 configurations / 21 windows.
          Lower Fast profile retains P33/P40/P41/P42/P49 plus a distinct current lower scale.
          Regular exact profile appends a distinct current scale only when at most P65.
          Separate warmup, whole-NR GPU timestamps, optional visual holds with held samples excluded.
          Summary/raw/paired CSV and TXT retain stride and successful-correction columns.
          Negative paired delta means faster. Scene, geometry, GPU, dispersion and raw windows retained.
          No game performance or visual improvement claim before user validation.
          Below50 and Boundary profiles retain their controls; no benchmark appends a current scale above P65.
          Settings restored on benchmark finish/cancel. Debug view 7 shows actual pass-2 input even when correction is skipped.
          "@
          $notesPath = "artifacts/nr-v20/release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          $ErrorActionPreference = "Continue"
          gh release view $tag --json id 1>$null 2>$null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($exists) {
            gh release upload $tag $archive --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
            gh release edit $tag --target $env:GITHUB_SHA --title "OptiScaler NR v36 - Cadence 74-84 / 85-90 percent, benchmarks up to 65 percent" --notes-file $notesPath --prerelease
          } else {
            gh release create $tag $archive --target $env:GITHUB_SHA --title "OptiScaler NR v36 - Cadence 74-84 / 85-90 percent, benchmarks up to 65 percent" --notes-file $notesPath --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
