name: Build NR v21 fast inter-pass quality comparison

on:
  push:
    branches:
      - codex/nr-interpass-v12-interior-addressing
      - codex/nr-interpass-v13-bounded-area
    paths:
      - OptiScaler/Config.h
      - OptiScaler/Config.cpp
      - OptiScaler.ini
      - OptiScaler/dlssnr/**
      - OptiScaler/shaders/dlssnr/**
      - tests/test_nr_interpass_*.py
      - tests/test_nr_benchmark_cases.py
      - tests/nr_gpu/**
      - tools/compile_nr_interpass.ps1
      - .github/workflows/build_nr_detail_quality_experiments.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nr-interpass-v21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify retained arithmetic and benchmark
        shell: powershell
        run: |
          foreach ($test in @("shared_bilinear", "dynamic_geometry", "classic_downsample_clamp", "classic_guided_stencil", "tiled_fused_area")) {
            python "tests/test_nr_interpass_${test}.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tests/test_nr_benchmark_cases.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile standard shader, retained RGB PSOs and isolated Fast PSO
        shell: powershell
        run: ./tools/compile_nr_interpass.ps1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run production policy tests and compile GPU parity fixture
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "C++ toolchain missing" }
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          New-Item -ItemType Directory -Force -Path artifacts/nr-v20 | Out-Null
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_policy.cpp /Fe:artifacts/nr-v20/interpass_policy.exe /Fo:artifacts/nr-v20/interpass_policy.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/nr-v20/interpass_policy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_parity.cpp /Fe:artifacts/nr-v20/interpass_parity.exe /Fo:artifacts/nr-v20/interpass_parity.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_low_timing.cpp /Fe:artifacts/nr-v20/interpass_low_timing.exe /Fo:artifacts/nr-v20/interpass_low_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_fast_quality.cpp /Fe:artifacts/nr-v20/interpass_fast_quality.exe /Fo:artifacts/nr-v20/interpass_fast_quality.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_fast_timing.cpp /Fe:artifacts/nr-v20/interpass_fast_timing.exe /Fo:artifacts/nr-v20/interpass_fast_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "nr-interpass-v21-fast-quality-20261010"

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-interpass-v21-fast-quality-20261010
          path: release/OptiScaler-NR-nr-interpass-v21-fast-quality-20261010.zip
          if-no-files-found: error

      - name: Publish experimental GitHub Release
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nr-interpass-v21-fast-quality-20261010"
          $archive = "release/OptiScaler-NR-nr-interpass-v21-fast-quality-20261010.zip"
          $notes = @"
          Experimental Fast inter-pass from $env:GITHUB_SHA, after the existing exact Optimized option.
          Fast reuses the immutable Area proxy and evaluates one guided residual per working pixel.
          Full 3x3 bilateral weights and frequency/shadow shaping remain; native integration is approximate.
          Area/radius-one/actual 50-90% only; other settings retain the exact v20 Optimized policy.
          Separate lazy Fast PSO without LDS, scratch, extra dispatches or per-frame allocations.
          New comparison: exactly P50/P59/P65, Temporal DLAA residual + P100-guided, six passes.
          Off, both unoptimized references, Optimized/Fast/Fast/Optimized; 15 configurations / 21 windows.
          Optional manual holds after each warmed measurement permit visual checks and before/after captures.
          Whole-NR GPU CSV includes gain vs Optimized, P95, SD, window medians/spread and raw samples.
          Original settings restored at finish/cancel; regular/Below50/Boundary profiles remain available.
          Fast intentionally changes quality. Inspect fine detail, edges, shadows and motion in your game.
          Synthetic shader timing is not a whole-game result or proof of imperceptible quality loss.
          "@
          $ErrorActionPreference = "Continue"
          gh release view $tag --json id 1>$null 2>$null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($exists) {
            gh release upload $tag $archive --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
            gh release edit $tag --target $env:GITHUB_SHA --title "OptiScaler NR v21 - Fast inter-pass quality comparison" --notes $notes --prerelease
          } else {
            gh release create $tag $archive --target $env:GITHUB_SHA --title "OptiScaler NR v21 - Fast inter-pass quality comparison" --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
