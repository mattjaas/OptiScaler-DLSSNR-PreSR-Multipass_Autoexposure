name: Build NR inter-pass exact optimized

on:
  push:
    branches:
      - codex/nr-interpass-exact-optimized
    paths:
      - OptiScaler/Config.h
      - OptiScaler/Config.cpp
      - OptiScaler.ini
      - OptiScaler/dlssnr/PassProfiles.h
      - OptiScaler/dlssnr/DlssNr_Menu.cpp
      - OptiScaler/dlssnr/DlssNr_MenuControls.cpp
      - OptiScaler/dlssnr/DlssNr_Status.h
      - OptiScaler/dlssnr/DlssNr_Status.cpp
      - OptiScaler/dlssnr/DlssNr_AnalysisCapture.h
      - OptiScaler/shaders/dlssnr/DlssNr_Common.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_DeferredSr.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Status.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_FinishedQueue.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_ModelState.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Resources.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_State.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Encode.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Run.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Enlarge.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Upscaler_Dx12.h
      - OptiScaler/shaders/dlssnr/DlssNr_Upscaler_Dx12.cpp
      - OptiScaler/shaders/dlssnr/precompile/dlssnr.hlsl
      - .github/workflows/build_nr_detail_quality_experiments.yml

permissions:
  contents: write

concurrency:
  group: nr-interpass-exact-opt-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Rebuild NR detail experiment shader
        shell: powershell
        run: |
          Push-Location "OptiScaler/shaders/dlssnr/precompile"
          & "..\..\shader_tools\dxc.exe" -T cs_6_0 -E CSMain -O3 -Qstrip_debug -Qstrip_reflect "dlssnr.hlsl" -Fo "DlssNr_Shader.cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "..\..\shader_tools\create_header.py" "DlssNr_Shader.cso" "DlssNr_Shader.h" "DlssNr_cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "nr-interpass-exact-opt-v1-20261009"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-lowband-antialias-v1-20261009
          path: release/OptiScaler-NR-nr-interpass-exact-opt-v1-20261009.zip
          if-no-files-found: error

      - name: Publish compiled ZIP as experimental GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nr-interpass-exact-opt-v1-20261009"
          $archive = "release/OptiScaler-NR-nr-interpass-exact-opt-v1-20261009.zip"
          if (-not (Test-Path $archive)) { throw "Release ZIP missing: $archive" }
          $notes = @"
          Experimental build from commit $env:GITHUB_SHA of codex/nr-interpass-exact-optimized.

          Keeps the previous 8x8 positive-window low-band antialias fix.
          Adds UI toggle Exact optimized inter-pass (OFF=old reference, ON=fast).
          Optimizations: one Gaussian exp2 instead of two, exact P50 Area
          2x2 shared source candidate loads, dynamic radius loops, and
          optional identical-gain low-field dispatch elimination.
          Reference image math is preserved, with only FP rounding differences.
          Measure GPU ms using the same scene and settings, switching the toggle.
          Actual performance and in-game equivalence require validation.
          "@
          gh release create $tag $archive --target $env:GITHUB_SHA --title "OptiScaler NR - exact optimized inter-pass v1 (experimental)" --notes $notes --prerelease
