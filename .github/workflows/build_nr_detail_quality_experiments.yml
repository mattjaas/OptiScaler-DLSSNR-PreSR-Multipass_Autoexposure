name: Build NR dynamic inter-pass geometry v3

on:
  push:
    branches:
      - codex/nr-interpass-dynamic-geometry-v3
    paths:
      - OptiScaler/Config.h
      - OptiScaler/Config.cpp
      - OptiScaler.ini
      - OptiScaler/dlssnr/PassProfiles.h
      - OptiScaler/dlssnr/DlssNr_Menu.cpp
      - OptiScaler/dlssnr/DlssNr_MenuControls.cpp
      - OptiScaler/dlssnr/DlssNr_Status.h
      - OptiScaler/dlssnr/DlssNr_Status.cpp
      - OptiScaler/dlssnr/DlssNr_AnalysisCapture.h
      - OptiScaler/shaders/dlssnr/DlssNr_Common.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_DeferredSr.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Status.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_FinishedQueue.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_ModelState.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Resources.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_State.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Encode.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Run.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Enlarge.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Upscaler_Dx12.h
      - OptiScaler/shaders/dlssnr/DlssNr_Upscaler_Dx12.cpp
      - OptiScaler/shaders/dlssnr/precompile/dlssnr.hlsl
      - tests/test_nr_interpass_shared_bilinear.py
      - tests/test_nr_interpass_dynamic_geometry.py
      - .github/workflows/build_nr_detail_quality_experiments.yml

permissions:
  contents: write

concurrency:
  group: nr-interpass-dynamic-geometry-v3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify shared P50 bilateral / bilinear arithmetic
        shell: powershell
        run: python tests/test_nr_interpass_shared_bilinear.py

      - name: Verify arbitrary Resolution P50-P97 guided and Area parity
        shell: powershell
        run: python tests/test_nr_interpass_dynamic_geometry.py

      - name: Rebuild NR detail experiment shader
        shell: powershell
        run: |
          Push-Location "OptiScaler/shaders/dlssnr/precompile"
          & "..\..\shader_tools\dxc.exe" -T cs_6_0 -E CSMain -O3 -Qstrip_debug -Qstrip_reflect "dlssnr.hlsl" -Fo "DlssNr_Shader.cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "..\..\shader_tools\create_header.py" "DlssNr_Shader.cso" "DlssNr_Shader.h" "DlssNr_cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "nr-interpass-dynamic-geometry-v3-20261009"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-interpass-dynamic-geometry-v3-20261009
          path: release/OptiScaler-NR-nr-interpass-dynamic-geometry-v3-20261009.zip
          if-no-files-found: error

      - name: Publish compiled ZIP as experimental GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nr-interpass-dynamic-geometry-v3-20261009"
          $archive = "release/OptiScaler-NR-nr-interpass-dynamic-geometry-v3-20261009.zip"
          if (-not (Test-Path $archive)) { throw "Release ZIP missing: $archive" }
          $notes = @"
          Experimental build from commit $env:GITHUB_SHA of codex/nr-interpass-dynamic-geometry-v3.

          Retains the low-band antialias improvements and exact optimized v1/v2.
          New Dynamic shared taps (all resolutions) option for Fused + Area +
          Guided radius 1. Uses the existing 3x3 guided source loads also to
          reconstruct bilinear residual for each P100 texel at any actual scale,
          including P53/P66/P77, while exact P50 v2 remains the primary path.
          The CPU caches the two source/native geometry ratios and rebuilds them
          ONLY on actual dimension changes, not every frame. Pixel positions and
          image-dependent weights necessarily remain shader calculations.
          Other filters/radii use existing fallback. No extra GPU dispatch,
          geometry texture, shader compilation on slider changes or CPU-GPU wait.
          Includes deterministic arithmetic tests across 11 scales and odd
          dimensions, plus DXC compile and Windows Release package.
          Use UI toggle to A/B compare GPU ms and image motion with v2.
          Actual GPU speed and pixel-level parity require in-game testing.
          "@
          gh release create $tag $archive --target $env:GITHUB_SHA --title "OptiScaler NR - dynamic resolution inter-pass v3 (experimental)" --notes $notes --prerelease
