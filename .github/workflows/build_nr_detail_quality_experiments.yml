name: Build NR isolated tiled PSO v7.1

on:
  push:
    branches:
      - codex/nr-interpass-tiled-isolated-pso-v7-1
    paths:
      - OptiScaler/Config.h
      - OptiScaler/Config.cpp
      - OptiScaler.ini
      - OptiScaler/dlssnr/PassProfiles.h
      - OptiScaler/dlssnr/DlssNr_Menu.cpp
      - OptiScaler/dlssnr/DlssNr_MenuControls.cpp
      - OptiScaler/dlssnr/DlssNr_Status.h
      - OptiScaler/dlssnr/DlssNr_Status.cpp
      - OptiScaler/dlssnr/DlssNr_AnalysisCapture.h
      - OptiScaler/shaders/dlssnr/DlssNr_Common.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_DeferredSr.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Status.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_FinishedQueue.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_ModelState.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Resources.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_State.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Encode.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Run.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Enlarge.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Upscaler_Dx12.h
      - OptiScaler/shaders/dlssnr/DlssNr_Upscaler_Dx12.cpp
      - OptiScaler/shaders/dlssnr/precompile/dlssnr.hlsl
      - tests/test_nr_interpass_shared_bilinear.py
      - tests/test_nr_interpass_dynamic_geometry.py
      - tests/test_nr_interpass_paired_area.py
      - tests/test_nr_interpass_classic_downsample_clamp.py
      - tests/test_nr_interpass_classic_guided_stencil.py
      - tests/test_nr_interpass_tiled_fused_area.py
      - .github/workflows/build_nr_detail_quality_experiments.yml

permissions:
  contents: write

concurrency:
  group: nr-interpass-tiled-fused-v7-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify shared P50 bilateral / bilinear arithmetic
        shell: powershell
        run: python tests/test_nr_interpass_shared_bilinear.py

      - name: Verify arbitrary Resolution P50-P97 guided and Area parity
        shell: powershell
        run: python tests/test_nr_interpass_dynamic_geometry.py

      - name: Verify paired P100 Area guided reconstruction on 13 scales
        shell: powershell
        run: python tests/test_nr_interpass_paired_area.py

      - name: Verify classical fused downsample-clamp FP16 and FP32 arithmetic
        shell: powershell
        run: python tests/test_nr_interpass_classic_downsample_clamp.py

      - name: Verify v6 classical P100 guided stencil arithmetic
        shell: powershell
        run: python tests/test_nr_interpass_classic_guided_stencil.py

      - name: Verify v7 tiled Fused Area parity and partial edge groups
        shell: powershell
        run: python tests/test_nr_interpass_tiled_fused_area.py

      - name: Rebuild NR detail experiment shader
        shell: powershell
        run: |
          Push-Location "OptiScaler/shaders/dlssnr/precompile"
          & "..\..\shader_tools\dxc.exe" -T cs_6_0 -E CSMain -O3 -Qstrip_debug -Qstrip_reflect "dlssnr.hlsl" -Fo "DlssNr_Shader.cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "..\..\shader_tools\create_header.py" "DlssNr_Shader.cso" "DlssNr_Shader.h" "DlssNr_cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Separate v7 PSO: ONLY this variant includes cooperative GPU tile memory.
          & "..\..\shader_tools\dxc.exe" -T cs_6_0 -E CSMain -O3 -Qstrip_debug -Qstrip_reflect -D DLSSNR_TILED_FUSED=1 "dlssnr.hlsl" -Fo "dlssnr_tiled_Shader.cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "..\..\shader_tools\create_header.py" "dlssnr_tiled_Shader.cso" "dlssnr_tiled_Shader.h" "dlssnr_tiled_cso"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Detect accidental identical shader variants; the tiled shader must differ.
          $mainHash = (Get-FileHash "DlssNr_Shader.cso" -Algorithm SHA256).Hash
          $tileHash = (Get-FileHash "dlssnr_tiled_Shader.cso" -Algorithm SHA256).Hash
          if ($mainHash -eq $tileHash) { throw "Tiled and normal shader binary are identical" }
          Write-Host "Normal DXIL SHA256: $mainHash"
          Write-Host "Tiled DXIL SHA256: $tileHash"
          Pop-Location

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "nr-interpass-tiled-isolated-pso-v7.1-20261010"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-interpass-tiled-fused-v7-20261010
          path: release/OptiScaler-NR-nr-interpass-tiled-isolated-pso-v7.1-20261010.zip
          if-no-files-found: error

      - name: Publish compiled ZIP as experimental GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nr-interpass-tiled-isolated-pso-v7.1-20261010"
          $archive = "release/OptiScaler-NR-nr-interpass-tiled-isolated-pso-v7.1-20261010.zip"
          if (-not (Test-Path $archive)) { throw "Release ZIP missing: $archive" }
          $notes = @"
          Experimental build from commit $env:GITHUB_SHA of codex/nr-interpass-tiled-isolated-pso-v7-1.

          v7.1 isolates the original v7 cooperative Fused+Area tiled shader
          from the normal all-mode DLSS NR compute shader. Compiles two
          different DXIL blobs with the same constant layout, root signature
          and resource table.
          The standard CSMain has NO v7 group memory, barrier or early branch,
          so off-interpass and classic paths cannot reserve those resources.
          The tiled PSO is created lazily only when Tiled v7 is enabled and
          actually selected, with transparent standard-Fused fallback if
          tiled PSO initialization fails.
          Preserves P50 Fused fast path and all Classic v5/v6 optimizations.
          Does not change numerical reconstruction, Area, guided weight,
          temporal, frequency shaping or shadow gate math from v7.
          v7 tiled Fused ON/OFF still selectable; A/B GPU testing required.
          Regression parity tests + both DXC compiles + Win64 Release tested.
          "@
          gh release create $tag $archive --target $env:GITHUB_SHA --title "OptiScaler NR - isolated standard and tiled PSOs v7.1 (experimental)" --notes $notes --prerelease
