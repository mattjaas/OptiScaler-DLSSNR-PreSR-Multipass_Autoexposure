name: Build NR v57 Superior Scaling final low cache geometry

on:
  push:
    branches:
      - codex/nr-interpass-v12-interior-addressing
      - codex/nr-interpass-v13-bounded-area
    paths:
      - OptiScaler/Config.h
      - OptiScaler/Config.cpp
      - OptiScaler.ini
      - OptiScaler/dlssnr/**
      - OptiScaler/shaders/dlssnr/**
      - tests/test_nr_interpass_*.py
      - tests/test_nr_benchmark_cases.py
      - tests/test_nr_superior_scaling.py
      - tests/nr_gpu/**
      - tools/compile_nr_interpass.ps1
      - .github/workflows/build_nr_detail_quality_experiments.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nr-interpass-v57-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify retained arithmetic and benchmark
        shell: powershell
        run: |
          foreach ($test in @("shared_bilinear", "dynamic_geometry", "classic_downsample_clamp", "classic_guided_stencil", "tiled_fused_area", "fast_experiments", "cadence", "low_cache", "neutral_low")) {
            python "tests/test_nr_interpass_${test}.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tests/test_nr_benchmark_cases.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_nr_superior_scaling.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile standard shader, retained RGB/Fast and isolated experimental PSOs
        shell: powershell
        run: ./tools/compile_nr_interpass.ps1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run production policy tests and compile GPU parity fixture
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "C++ toolchain missing" }
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          New-Item -ItemType Directory -Force -Path artifacts/nr-v20 | Out-Null
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_policy.cpp /Fe:artifacts/nr-v20/interpass_policy.exe /Fo:artifacts/nr-v20/interpass_policy.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/nr-v20/interpass_policy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_parity.cpp /Fe:artifacts/nr-v20/interpass_parity.exe /Fo:artifacts/nr-v20/interpass_parity.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_low_timing.cpp /Fe:artifacts/nr-v20/interpass_low_timing.exe /Fo:artifacts/nr-v20/interpass_low_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_fast_quality.cpp /Fe:artifacts/nr-v20/interpass_fast_quality.exe /Fo:artifacts/nr-v20/interpass_fast_quality.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_fast_timing.cpp /Fe:artifacts/nr-v20/interpass_fast_timing.exe /Fo:artifacts/nr-v20/interpass_fast_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_experiments_quality.cpp /Fe:artifacts/nr-v20/interpass_experiments_quality.exe /Fo:artifacts/nr-v20/interpass_experiments_quality.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_experiments_timing.cpp /Fe:artifacts/nr-v20/interpass_experiments_timing.exe /Fo:artifacts/nr-v20/interpass_experiments_timing.obj /link d3d12.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile shared Low36 GPU audit and timing fixture
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "C++ toolchain missing" }
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          foreach ($fixture in @("quality", "timing")) {
            cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/interpass_low_cache_${fixture}.cpp /Fe:artifacts/nr-v20/interpass_low_cache_${fixture}.exe /Fo:artifacts/nr-v20/interpass_low_cache_${fixture}.obj /link d3d12.lib dxgi.lib"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Compile neutral low GPU contract
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "C++ toolchain missing" }
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          foreach ($fixture in @("interpass_neutral_low", "interpass_neutral_low_timing", "interpass_low_mean_timing", "interpass_gain_schedule_timing")) {
            cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/${fixture}.cpp /Fe:artifacts/nr-v20/${fixture}.exe /Fo:artifacts/nr-v20/${fixture}.obj /link d3d12.lib dxgi.lib"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify Superior Scaling policy and compile GPU checks
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "C++ toolchain missing" }
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/superior_policy.cpp /Fe:artifacts/nr-v20/superior_policy.exe /Fo:artifacts/nr-v20/superior_policy.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/nr-v20/superior_policy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($fixture in @("superior_carrier", "superior_timing", "superior_resolve_quality", "superior_resolve_timing", "superior_prepare_quality", "superior_prepare_timing", "superior_input_quality", "superior_input_timing", "superior_low_quality", "superior_low_timing", "superior_numeric_quality", "superior_numeric_timing", "superior_area_quality", "superior_area_timing", "superior_exposure_quality", "superior_exposure_timing", "superior_cached_low_quality", "superior_cached_low_timing", "superior_precision_quality", "superior_precision_timing")) {
            cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/${fixture}.cpp /Fe:artifacts/nr-v20/${fixture}.exe /Fo:artifacts/nr-v20/${fixture}.obj /link d3d12.lib dxgi.lib"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "nr-superior-scaling-v57-20261020"

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-superior-scaling-v57-20261020
          path: release/OptiScaler-NR-nr-superior-scaling-v57-20261020.zip
          if-no-files-found: error

      - name: Publish experimental GitHub Release
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nr-superior-scaling-v57-20261020"
          $archive = "release/OptiScaler-NR-nr-superior-scaling-v57-20261020.zip"
          $notes = @"
          Superior Scaling final-low cache geometry, from $env:GITHUB_SHA.
          FP16 experiments isolated the benefit of a larger output group; FP16 storage did not convincingly beat FP32 at equal geometry.
          Production keeps FP32 and changes the final-low group from 8x4 to 8x8, sharing a 36x36 tile.
          Keeps all 64 taps, weights, normalization, HDR, finite handling and API requirements.
          Strict GPU bit parity: 264 cases / 8816280 words including FP16/FP32, raw half patterns, signed HDR stress and native 4K.
          No observed differences on RTX 4090; no universal visual or game-motion guarantee is claimed.
          Two ABBA/BAAB series compare low plus unchanged resolve; A/A and equal-geometry FP16 controls are recorded.
          FP16 arithmetic candidates exceeded the image error budget and are not enabled.
          No new menu option, PSO, dispatch, texture, barrier, copy, per-frame allocation or diagnostic.
          Only the existing final-low shader changes; the other 20 existing binaries, including interpasses and HDR resolve, are unchanged.
          Reproducible FP16 prototypes remain offline in tools/audits/fp16/prepare.py.
          Full measurements and limitations: docs/NR-v57-superior-low-precision.md.
          "@
          $notesPath = "artifacts/nr-v20/release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          $ErrorActionPreference = "Continue"
          gh release view $tag --json id 1>$null 2>$null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($exists) {
            gh release upload $tag $archive "x64/Release/OptiScaler.dll" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
            gh release edit $tag --target $env:GITHUB_SHA --title "OptiScaler NR v57 - Superior Scaling final low cache geometry" --notes-file $notesPath --prerelease
          } else {
            gh release create $tag $archive "x64/Release/OptiScaler.dll" --target $env:GITHUB_SHA --title "OptiScaler NR v57 - Superior Scaling final low cache geometry" --notes-file $notesPath --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
