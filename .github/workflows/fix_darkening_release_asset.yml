name: Fix Darkening Guard release asset

on:
  push:
    branches:
      - codex/finished-picture-fast-compose
    paths:
      - tools/fix_darkening_release_asset.trigger

permissions:
  contents: write
  actions: read

jobs:
  fix-asset:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: finished-picture-fast-compose-darkening-fix
      SOURCE_RUN: "36253579959"
      SOURCE_ARTIFACT: OptiScaler-NR-finished-picture-fast-compose
      FINAL_NAME: OptiScaler-NR-finished-picture-fast-compose-darkening-fix.zip
      EXTRA_NAME: OptiScaler-NR-finished-picture-fast-compose.zip

    steps:
      - name: Download corrected artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_artifact
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir release_artifact
          ASSET="$(find release_artifact -type f -name '*.zip' | head -n 1)"
          test -n "$ASSET"
          cp "$ASSET" "$FINAL_NAME"

      - name: Replace old asset and remove duplicate
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$FINAL_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$EXTRA_NAME"; then
            gh release delete-asset "$RELEASE_TAG" "$EXTRA_NAME" --repo "$GITHUB_REPOSITORY" -y
          fi
