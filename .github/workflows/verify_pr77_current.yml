name: Verify PR 77 current head

on:
  push:
    branches:
      - release-71194b5a

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: 59855487b76c3cb9b200f8341b1d72584bef2c87
          fetch-depth: 0
          submodules: false

      - name: Rebuild DLSS-NR shaders
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'OptiScaler\shaders\dlssnr\precompile'
          $tools = Join-Path $env:GITHUB_WORKSPACE 'OptiScaler\shaders\shader_tools'
          Push-Location $dir
          & (Join-Path $tools 'fxc.exe') /T cs_5_0 /E CSMain /O3 dlssnr.hlsl /Fo DlssNr_Shader.cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools 'create_header.py') DlssNr_Shader.cso DlssNr_Shader.h DlssNr_cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $tools 'dxc.exe') -spirv -T cs_6_0 -E CSMain -O3 -Qstrip_debug -D VK_MODE -Cc -Vi dlssnr.hlsl -Fo DlssNr_Shader_Vk.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools 'create_header.py') DlssNr_Shader_Vk.spv DlssNr_Shader_Vk.h dlssnr_spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Checkout submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git -c core.longpaths=true submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Full build and package
        shell: powershell
        run: |
          .\package_release.ps1 -Version 'pr77-current-verify'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
