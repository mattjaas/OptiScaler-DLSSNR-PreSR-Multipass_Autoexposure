name: Release NR proxy scaler defaults

on:
  push:
    branches:
      - codex/rdr2-finished-picture-credit-pr94-pr109
    paths:
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_State.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Enlarge.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Run.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_FinishedCompose.cpp
      - OptiScaler/Config.h
      - OptiScaler.ini
      - OptiScaler/dlssnr/DlssNr_MenuControls.cpp
      - OptiScaler/shaders/dlssnr/precompile/dlssnr.hlsl
      - .github/workflows/release_upscaled_residual_direct.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Record release source
        shell: powershell
        run: |
          "TARGET_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "rdr2-pr94-pr109-proxy-defaults-20260928"

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "rdr2-pr94-pr109-proxy-defaults-20260928"
          $asset = "release/OptiScaler-NR-rdr2-pr94-pr109-proxy-defaults-20260928.zip"
          $notes = @"
          Built from source commit $env:TARGET_SHA.

          Changes:
          - P100 -> reduced proxy defaults to Area for both Direct NR and Upscaled NR residual.
          - P50/reduced proxy -> P100 reference reconstruction now defaults to FSR1 for both modes.
          - NR50 -> NR100 output upscaler defaults are unchanged.
          - Existing explicit user selections remain respected.
          "@
          gh release create $tag $asset --target $env:TARGET_SHA --title "OptiScaler NR - proxy scaler defaults" --notes $notes
