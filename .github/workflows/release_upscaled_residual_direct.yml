name: Release NR Upscaled residual async fix

on:
  push:
    branches:
      - codex/rdr2-finished-picture-credit-pr94-pr109
    paths:
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_State.h
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Enlarge.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_Run.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp
      - OptiScaler/shaders/dlssnr/DlssNr_Dx12_FinishedCompose.cpp
      - OptiScaler/shaders/dlssnr/precompile/dlssnr.hlsl
      - .github/workflows/release_upscaled_residual_direct.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 0

      - name: Enable Windows long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Record release source
        shell: powershell
        run: |
          "TARGET_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: powershell
        run: ./package_release.ps1 -Version "rdr2-pr94-pr109-upscaled-residual-async-fix-20260928"

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "rdr2-pr94-pr109-upscaled-residual-async-fix-20260928"
          $asset = "release/OptiScaler-NR-rdr2-pr94-pr109-upscaled-residual-async-fix-20260928.zip"
          $notes = @"
          Built from source commit $env:TARGET_SHA.

          Changes:
          - Upscaled NR residual now actually starts async P50 -> P100 work in Finished Picture.
          - Ordinary post-SR async now supports Transfer 6 and uses the UpscaledResidual execution/upscaler settings.
          - Direct NR keeps its existing async gating and settings.
          - Transfer 6 still joins before the native-resolution residual compose.
          "@
          gh release create $tag $asset --target $env:TARGET_SHA --title "OptiScaler NR - Upscaled residual async fix" --notes $notes
