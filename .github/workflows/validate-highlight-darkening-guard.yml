name: Validate highlight and darkening guards

on:
  push:
    branches:
      - test/highlight-darkening-guard

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/highlight-darkening-guard
          fetch-depth: 0
          submodules: 'true'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Recompile DLSSNR shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pre = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\dlssnr\precompile"
          $tools = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\shader_tools"
          Set-Location $pre

          & (Join-Path $tools "fxc.exe") /T cs_5_0 /E CSMain /O3 dlssnr.hlsl /Fo DlssNr_Shader.cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader.cso DlssNr_Shader.h DlssNr_cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & (Join-Path $tools "dxc.exe") -spirv -T cs_6_0 -E CSMain -O3 -Qstrip_debug -D VK_MODE -Cc -Vi dlssnr.hlsl -Fo DlssNr_Shader_Vk.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader_Vk.spv DlssNr_Shader_Vk.h dlssnr_spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build full Release configuration
        working-directory: ${{ github.workspace }}
        run: msbuild /m /p:Configuration=Release . /verbosity:minimal

      - name: Package Release artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "x64\Release\a"
          if (-not (Test-Path $out)) { throw "Release output directory not found: $out" }
          $archive = Join-Path $env:GITHUB_WORKSPACE "OptiScaler_highlight_darkening_guard_release.7z"
          7z a -r $archive "$out\*.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7.0.0
        with:
          name: OptiScaler-highlight-darkening-guard-release
          path: ${{ github.workspace }}\OptiScaler_highlight_darkening_guard_release.7z
          archive: false
          compression-level: 0
          if-no-files-found: error

      - name: Commit regenerated shaders and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.cso
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.spv
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h
          git rm .github/workflows/validate-highlight-darkening-guard.yml
          git commit -m "Regenerate guard shaders after successful Release build [guard-build]"
          git push origin HEAD:test/highlight-darkening-guard
