name: Normalize Auto Exposure shader artifacts

on:
  push:
    branches:
      - v0.8.4-autoexposure

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'mattjaas/OptiScaler-DLSSNR-PreSR-Multipass_Autoexposure'
    runs-on: windows-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild tracked shaders exactly like upstream
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin v0.8.4-autoexposure-source
          git checkout -B v0.8.4-autoexposure-source origin/v0.8.4-autoexposure-source

          $dir = Join-Path $env:GITHUB_WORKSPACE 'OptiScaler\shaders\dlssnr\precompile'
          $tools = Join-Path $env:GITHUB_WORKSPACE 'OptiScaler\shaders\shader_tools'

          Push-Location $dir
          & (Join-Path $tools 'fxc.exe') /T cs_5_0 /E CSMain /O3 dlssnr.hlsl /Fo DlssNr_Shader.cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools 'create_header.py') DlssNr_Shader.cso DlssNr_Shader.h DlssNr_cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & (Join-Path $tools 'dxc.exe') -spirv -T cs_6_0 -E CSMain -O3 -Qstrip_debug -D VK_MODE -Cc -Vi dlssnr.hlsl -Fo DlssNr_Shader_Vk.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools 'create_header.py') DlssNr_Shader_Vk.spv DlssNr_Shader_Vk.h dlssnr_spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          git add -- 'OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.cso' 'OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h' 'OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.spv' 'OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h'
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:v0.8.4-autoexposure-source
