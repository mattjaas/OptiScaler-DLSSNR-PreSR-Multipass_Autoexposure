name: Validate upstream UI parity

on:
  push:
    branches:
      - v0.8.4-autoexposure

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout source branch
        shell: powershell
        run: |
          git config --global core.longpaths true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin v0.8.4-autoexposure-source
          git checkout -B v0.8.4-autoexposure-source origin/v0.8.4-autoexposure-source

      - name: Checkout submodules
        shell: powershell
        run: |
          git submodule sync --recursive
          git -c core.longpaths=true submodule update --init --recursive --force

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Full build and package
        shell: powershell
        run: |
          .\package_release.ps1 -Version 'v0.8.4-autoexposure-ui-parity-test'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Squash source branch
        shell: powershell
        run: |
          git reset --soft 8802b2b470db0462fa1ed03a125e793a7c06d735
          git add OptiScaler
          git commit -m 'Add automatic exposure and exposure-dependent Trim'
          git push --force-with-lease origin HEAD:v0.8.4-autoexposure-source
