name: Regenerate highlight guard shaders

on:
  push:
    branches:
      - fix/highlight-guard-brightening-only

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[shader-regen]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/highlight-guard-brightening-only

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Recompile DLSSNR shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pre = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\dlssnr\precompile"
          $tools = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\shader_tools"
          Set-Location $pre

          & (Join-Path $tools "fxc.exe") /T cs_5_0 /E CSMain /O3 dlssnr.hlsl /Fo DlssNr_Shader.cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader.cso DlssNr_Shader.h DlssNr_cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & (Join-Path $tools "dxc.exe") -spirv -T cs_6_0 -E CSMain -O3 -Qstrip_debug -D VK_MODE -Cc -Vi dlssnr.hlsl -Fo DlssNr_Shader_Vk.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader_Vk.spv DlssNr_Shader_Vk.h dlssnr_spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit regenerated binaries and remove temporary workflow
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.cso
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.spv
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h
          git rm .github/workflows/regenerate-highlight-guard.yml
          git commit -m "Regenerate DLSSNR shader binaries [shader-regen]"
          git push origin HEAD:fix/highlight-guard-brightening-only
