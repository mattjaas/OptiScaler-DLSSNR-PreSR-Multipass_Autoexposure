name: Materialize Auto Exposure precompiled shaders

on:
  push:
    branches:
      - v0.8.4-autoexposure

permissions:
  contents: write

jobs:
  shaders:
    if: github.repository == 'mattjaas/OptiScaler-DLSSNR-PreSR-Multipass_Autoexposure'
    runs-on: windows-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Regenerate tracked DLSS-NR shaders on PR branch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $embed = Join-Path $env:RUNNER_TEMP "embed_dlssnr_spirv.py"
          Copy-Item ".\tools\embed_dlssnr_spirv.py" $embed -Force

          git fetch origin v0.8.4-autoexposure-source
          git checkout -B v0.8.4-autoexposure-source origin/v0.8.4-autoexposure-source

          $dir = "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile"

          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe was not found" }
          & $fxc.FullName /nologo /T cs_5_0 /E CSMain /O3 /Fo "$dir\DlssNr_Shader.cso" /Fh "$dir\DlssNr_Shader.h" /Vn DlssNr_cso "$dir\dlssnr.hlsl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $zip = Join-Path $env:RUNNER_TEMP "dxc_2026_07_29.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc_spirv"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip" -OutFile $zip
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241"
          if ($actualHash -ne $expectedHash) { throw "DXC archive SHA256 mismatch" }
          Expand-Archive -Path $zip -DestinationPath $dxcRoot -Force
          $dxc = Get-ChildItem $dxcRoot -Recurse -Filter dxc.exe |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (-not $dxc) { throw "dxc.exe was not found" }

          & $dxc.FullName -spirv -T cs_6_0 -E CSMain -D VK_MODE=1 -fvk-use-dx-layout -O3 -Fo "$dir\DlssNr_Shader.spv" "$dir\dlssnr.hlsl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python $embed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$dir\DlssNr_Shader.spv" "$dir\DlssNr_Shader_Vk.spv" -Force
          Remove-Item "$dir\DlssNr_Shader.spv" -Force

          git add -- "OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.cso" "OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h" "OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h" "OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.spv"

          if (-not (git diff --cached --quiet)) {
            git commit --amend --no-edit
            git push --force-with-lease origin HEAD:v0.8.4-autoexposure-source
          } else {
            Write-Host "Precompiled shader artifacts already match the source."
          }

          git diff --name-status 8802b2b470db0462fa1ed03a125e793a7c06d735..HEAD
