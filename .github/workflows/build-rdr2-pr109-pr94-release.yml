name: Build RDR2 PR109 + PR94 Release

on:
  push:
    branches:
      - codex/rdr2-finished-picture-credit-pr109

permissions:
  contents: write

jobs:
  build-release:
    if: ${{ !contains(github.event.head_commit.message, '[rdr2-pr109-pr94-release]') }}
    runs-on: windows-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: codex/rdr2-finished-picture-credit-pr109
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate DLSSNR shader binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pre = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\dlssnr\precompile"
          $tools = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\shader_tools"
          Set-Location $pre

          & (Join-Path $tools "fxc.exe") /T cs_5_0 /E CSMain /O3 dlssnr.hlsl /Fo DlssNr_Shader.cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader.cso DlssNr_Shader.h DlssNr_cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & (Join-Path $tools "dxc.exe") -spirv -T cs_6_0 -E CSMain -O3 -Qstrip_debug -D VK_MODE -Cc -Vi dlssnr.hlsl -Fo DlssNr_Shader_Vk.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader_Vk.spv DlssNr_Shader_Vk.h dlssnr_spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package Release
        shell: pwsh
        run: ./package_release.ps1 -Version "rdr2-pr109-pr94-20260926"

      - name: Commit regenerated shaders and remove one-shot workflow
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.cso
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.spv
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h
          git rm .github/workflows/build-rdr2-pr109-pr94-release.yml
          git commit -m "Regenerate PR94 shaders and build release [rdr2-pr109-pr94-release]"
          git push origin HEAD:codex/rdr2-finished-picture-credit-pr109

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-rdr2-pr109-pr94-20260926
          path: release/OptiScaler-NR-rdr2-pr109-pr94-20260926.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "rdr2-pr109-pr94-20260926" "release/OptiScaler-NR-rdr2-pr109-pr94-20260926.zip" --target "codex/rdr2-finished-picture-credit-pr109" --title "OptiScaler NR rdr2-pr109-pr94-20260926" --notes "Built from codex/rdr2-finished-picture-credit-pr109. Includes upstream PR #109 and PR #94 (Highlight guard brightening-only), with shaders regenerated from the current source."
