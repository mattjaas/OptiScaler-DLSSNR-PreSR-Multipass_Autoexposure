name: Validate RDR2 PR109 plus current PR94 darkening guard

on:
  push:
    branches:
      - codex/rdr2-finished-picture-credit-pr109-pr94

permissions:
  contents: write

jobs:
  build-release:
    if: ${{ !contains(github.event.head_commit.message, '[rdr2-pr109-pr94-darkening-build]') }}
    runs-on: windows-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: codex/rdr2-finished-picture-credit-pr109-pr94
          fetch-depth: 0
          submodules: false

      - name: Enable Windows long paths and fetch submodules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --system core.longpaths true
          git submodule sync
          git submodule update --init --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Recompile DLSSNR shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pre = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\dlssnr\precompile"
          $tools = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\shader_tools"
          Set-Location $pre

          & (Join-Path $tools "fxc.exe") /T cs_5_0 /E CSMain /O3 dlssnr.hlsl /Fo DlssNr_Shader.cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader.cso DlssNr_Shader.h DlssNr_cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & (Join-Path $tools "dxc.exe") -spirv -T cs_6_0 -E CSMain -O3 -Qstrip_debug -D VK_MODE -Cc -Vi dlssnr.hlsl -Fo DlssNr_Shader_Vk.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader_Vk.spv DlssNr_Shader_Vk.h dlssnr_spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build full Release configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild /m /p:Configuration=Release . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit regenerated shaders and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.cso
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.spv
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h
          git rm .github/workflows/validate-rdr2-pr109-pr94-darkening.yml
          git commit -m "Regenerate current PR94 shaders on PR109 base [rdr2-pr109-pr94-darkening-build]"
          git push origin HEAD:codex/rdr2-finished-picture-credit-pr109-pr94
