name: Release Highlight Guard Brightening Only

on:
  push:
    branches:
      - release/highlight-guard-brightening-only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact Highlight Guard source
        uses: actions/checkout@v6
        with:
          ref: 6398c05878221d9b071a53adc0dac272c0b22bc0
          fetch-depth: 0
          submodules: false

      - name: Checkout submodules with Windows long paths
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git -c core.longpaths=true submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build release package
        shell: powershell
        run: |
          .\package_release.ps1 -Version highlight-guard-brightening-only
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "highlight-guard-brightening-only"
          $asset = Get-ChildItem -Path ".\release" -Filter "OptiScaler-NR-highlight-guard-brightening-only.zip" -File | Select-Object -First 1
          if (-not $asset) {
            Write-Error "Release ZIP was not produced."
            exit 1
          }

          $notes = "Built from exact source commit 6398c05878221d9b071a53adc0dac272c0b22bc0 used by PR #94 to wilsjo2. Highlight Guard limits excessive brightening only; model-driven darkening is left uncapped. The PR branch was not modified by this release process."

          gh release create $tag $asset.FullName --target 6398c05878221d9b071a53adc0dac272c0b22bc0 --title "Highlight Guard - brightening only" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
