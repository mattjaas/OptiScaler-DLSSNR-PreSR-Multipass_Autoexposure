name: Validate darkening guard shadow fix

on:
  push:
    branches:
      - codex/finished-picture-fast-compose

permissions:
  contents: write

jobs:
  rebuild-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[darkening-shadow-build]') }}
    runs-on: windows-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: codex/finished-picture-fast-compose
          fetch-depth: 0
          submodules: false

      - name: Enable Windows long paths and fetch submodules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --system core.longpaths true
          git submodule sync
          git submodule update --init --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Recompile main DLSSNR shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pre = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\dlssnr\precompile"
          $tools = Join-Path $env:GITHUB_WORKSPACE "OptiScaler\shaders\shader_tools"
          Set-Location $pre

          & (Join-Path $tools "fxc.exe") /T cs_5_0 /E CSMain /O3 dlssnr.hlsl /Fo DlssNr_Shader.cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader.cso DlssNr_Shader.h DlssNr_cso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & (Join-Path $tools "dxc.exe") -spirv -T cs_6_0 -E CSMain -O3 -Qstrip_debug -D VK_MODE -Cc -Vi dlssnr.hlsl -Fo DlssNr_Shader_Vk.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $tools "create_header.py") DlssNr_Shader_Vk.spv DlssNr_Shader_Vk.h dlssnr_spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build specialized Finished Picture shaders
        shell: cmd
        run: call OptiScaler\shaders\dlssnr\precompile\build_finished_apply.bat

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build full Release configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild /m /p:Configuration=Release . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit regenerated main shaders and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.cso
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.spv
          git add OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h
          git rm .github/workflows/validate-darkening-guard-shadow-fix.yml
          git commit -m "Regenerate darkening guard shaders [darkening-shadow-build]"
          git push origin HEAD:codex/finished-picture-fast-compose
