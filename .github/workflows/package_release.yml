name: Package NR Build

on:
  push:
    branches:
      - codex/finished-picture-fast-compose
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version label'
        required: true
        default: 'nr-dev'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Enable long paths and fetch submodules
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build specialized finished-picture shaders
        shell: cmd
        run: call OptiScaler\shaders\dlssnr\precompile\build_finished_apply.bat
      - name: Package
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ inputs.version || 'finished-picture-fast-compose' }}
        run: ./package_release.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-${{ inputs.version || 'finished-picture-fast-compose' }}
          path: release/*.zip
          if-no-files-found: error
